<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Panel 1: Sequential -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="280" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="280" height="45" rx="12" fill="#0284c7"/>
    <text x="140" y="28" text-anchor="middle" font-family="'Kanit', sans-serif" font-weight="600" font-size="15" fill="#ffffff">1. แบบเรียงลำดับ (Sequential)</text>
    
    <rect x="65" y="70" width="150" height="36" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="140" y="93" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="12" fill="#0369a1">START</text>
    
    <line x1="140" y1="106" x2="140" y2="135" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
    
    <polygon points="50,175 210,175 230,140 70,140" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="140" y="162" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="12" fill="#92400e">INPUT mass, velocity</text>
    
    <line x1="140" y1="175" x2="140" y2="205" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
    
    <rect x="50" y="210" width="180" height="40" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="140" y="235" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="12" fill="#166534">E = 0.5 * mass * v²</text>
    
    <line x1="140" y1="250" x2="140" y2="280" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
    
    <polygon points="50,315 210,315 230,280 70,280" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="140" y="302" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="12" fill="#92400e">OUTPUT Energy</text>
    
    <line x1="140" y1="315" x2="140" y2="345" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
    
    <rect x="65" y="350" width="150" height="36" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="140" y="373" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="12" fill="#991b1b">END</text>
  </g>

  <!-- Panel 2: Selection -->
  <g transform="translate(330, 20)">
    <rect x="0" y="0" width="290" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="290" height="45" rx="12" fill="#10b981"/>
    <text x="145" y="28" text-anchor="middle" font-family="'Kanit', sans-serif" font-weight="600" font-size="15" fill="#ffffff">2. แบบทางเลือก (Selection)</text>
    
    <polygon points="145,90 220,130 145,170 70,130" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="145" y="134" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="12" fill="#9d174d">score >= 50 ?</text>
    
    <!-- True branch -->
    <line x1="70" y1="130" x2="30" y2="130" stroke="#059669" stroke-width="2"/>
    <line x1="30" y1="130" x2="30" y2="210" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>
    <text x="45" y="120" font-family="'Sarabun', sans-serif" font-weight="700" font-size="11" fill="#059669">True (จริง)</text>
    <rect x="5" y="215" width="100" height="40" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="55" y="240" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="11" fill="#166534">PRINT 'PASS'</text>
    
    <!-- False branch -->
    <line x1="220" y1="130" x2="260" y2="130" stroke="#dc2626" stroke-width="2"/>
    <line x1="260" y1="130" x2="260" y2="210" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
    <text x="225" y="120" font-family="'Sarabun', sans-serif" font-weight="700" font-size="11" fill="#dc2626">False (เท็จ)</text>
    <rect x="185" y="215" width="100" height="40" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="235" y="240" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="11" fill="#991b1b">PRINT 'FAIL'</text>
    
    <!-- Merge -->
    <line x1="55" y1="255" x2="55" y2="300" stroke="#0284c7" stroke-width="2"/>
    <line x1="235" y1="255" x2="235" y2="300" stroke="#0284c7" stroke-width="2"/>
    <line x1="55" y1="300" x2="235" y2="300" stroke="#0284c7" stroke-width="2"/>
    <line x1="145" y1="300" x2="145" y2="340" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
    
    <circle cx="145" cy="350" r="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- Panel 3: Iteration -->
  <g transform="translate(650, 20)">
    <rect x="0" y="0" width="280" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="280" height="45" rx="12" fill="#8b5cf6"/>
    <text x="140" y="28" text-anchor="middle" font-family="'Kanit', sans-serif" font-weight="600" font-size="15" fill="#ffffff">3. แบบวนซ้ำ (Iteration)</text>
    
    <rect x="65" y="70" width="150" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="140" y="93" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="12" fill="#166534">SET count = 1</text>
    
    <line x1="140" y1="106" x2="140" y2="135" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
    
    <polygon points="140,140 210,175 140,210 70,175" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="140" y="179" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="12" fill="#9d174d">count &lt;= 5 ?</text>
    
    <!-- True Loop Body -->
    <line x1="140" y1="210" x2="140" y2="245" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>
    <text x="155" y="230" font-family="'Sarabun', sans-serif" font-weight="700" font-size="11" fill="#059669">True</text>
    
    <rect x="40" y="250" width="200" height="38" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="140" y="274" text-anchor="middle" font-family="'Sarabun', sans-serif" font-size="12" fill="#0369a1">PRINT count, count += 1</text>
    
    <!-- Loop back arrow -->
    <path d="M 40 269 L 20 269 L 20 120 L 140 120 L 140 135" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
    
    <!-- False Exit -->
    <line x1="210" y1="175" x2="250" y2="175" stroke="#dc2626" stroke-width="2"/>
    <line x1="250" y1="175" x2="250" y2="340" stroke="#dc2626" stroke-width="2"/>
    <line x1="250" y1="340" x2="215" y2="340" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
    <text x="215" y="165" font-family="'Sarabun', sans-serif" font-weight="700" font-size="11" fill="#dc2626">False</text>
    
    <rect x="65" y="325" width="150" height="36" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="140" y="348" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="12" fill="#991b1b">END LOOP</text>
  </g>
</svg>