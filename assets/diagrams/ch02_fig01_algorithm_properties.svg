<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="gHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Root Main Title Node -->
  <rect x="250" y="20" width="400" height="55" rx="12" fill="url(#gHeader)" filter="url(#shadow)" stroke="#38bdf8" stroke-width="2"/>
  <text x="450" y="54" text-anchor="middle" font-family="'Sarabun', 'Kanit', sans-serif" font-weight="700" font-size="17" fill="#ffffff">5 คุณสมบัติของขั้นตอนวิธีที่ดี (Good Algorithm)</text>

  <!-- Branch lines -->
  <path d="M 450 75 L 450 110" stroke="#0284c7" stroke-width="2.5" fill="none"/>
  <path d="M 110 110 L 790 110" stroke="#0284c7" stroke-width="2.5" fill="none"/>
  
  <path d="M 110 110 L 110 140" stroke="#0284c7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280 110 L 280 140" stroke="#0284c7" stroke-width="2.5" fill="none"/>
  <path d="M 450 110 L 450 140" stroke="#0284c7" stroke-width="2.5" fill="none"/>
  <path d="M 620 110 L 620 140" stroke="#0284c7" stroke-width="2.5" fill="none"/>
  <path d="M 790 110 L 790 140" stroke="#0284c7" stroke-width="2.5" fill="none"/>

  <!-- Card 1 -->
  <rect x="30" y="140" width="160" height="200" rx="10" fill="url(#gCard)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="140" width="160" height="36" rx="10" fill="#3b82f6"/>
  <text x="110" y="163" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#ffffff">1. ข้อมูลเข้าชัดเจน</text>
  <text x="45" y="200" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ทราบชนิดข้อมูล</text>
  <text x="45" y="225" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ทราบขอบเขตค่า</text>
  <text x="45" y="250" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ระบุเงื่อนไขเริ่ม</text>

  <!-- Card 2 -->
  <rect x="200" y="140" width="160" height="200" rx="10" fill="url(#gCard)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="200" y="140" width="160" height="36" rx="10" fill="#10b981"/>
  <text x="280" y="163" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#ffffff">2. ผลลัพธ์ตรงเป้า</text>
  <text x="215" y="200" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ให้ผลลัพธ์ถูกต้อง</text>
  <text x="215" y="225" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ตรงตามโจทย์ 100%</text>
  <text x="215" y="250" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ตรวจสอบซ้ำได้</text>

  <!-- Card 3 -->
  <rect x="370" y="140" width="160" height="200" rx="10" fill="url(#gCard)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="370" y="140" width="160" height="36" rx="10" fill="#8b5cf6"/>
  <text x="450" y="163" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#ffffff">3. ไม่กำกวม</text>
  <text x="385" y="200" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ความหมายเดียว</text>
  <text x="385" y="225" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• คอมพิวเตอร์ทำตรง</text>
  <text x="385" y="250" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ไร้ข้อสงสัยตรรกะ</text>

  <!-- Card 4 -->
  <rect x="540" y="140" width="160" height="200" rx="10" fill="url(#gCard)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="540" y="140" width="160" height="36" rx="10" fill="#f59e0b"/>
  <text x="620" y="163" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#ffffff">4. มีจุดสิ้นสุด</text>
  <text x="555" y="200" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• จบในรอบจำกัด</text>
  <text x="555" y="225" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ไม่เกิด Infinite Loop</text>
  <text x="555" y="250" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• คำนวณเวลาได้</text>

  <!-- Card 5 -->
  <rect x="710" y="140" width="160" height="200" rx="10" fill="url(#gCard)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="710" y="140" width="160" height="36" rx="10" fill="#ec4899"/>
  <text x="790" y="163" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#ffffff">5. ประสิทธิผลจริง</text>
  <text x="725" y="200" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ปฏิบัติได้จริง</text>
  <text x="725" y="225" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• ใช้ทรัพยากรพอดี</text>
  <text x="725" y="250" font-family="'Sarabun', sans-serif" font-size="12" fill="#334155">• เกิดความคุ้มค่า</text>
</svg>