<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 560" width="100%" height="100%">
  <defs>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <filter id="drop3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="530" height="540" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#drop3)"/>
  <text x="275" y="40" text-anchor="middle" font-family="'Kanit', sans-serif" font-weight="700" font-size="16" fill="#0369a1">ผังงานโครงสร้างแบบวนซ้ำ (คำนวณผลรวม 1 ถึง 5)</text>

  <!-- INITIAL PROCESS -->
  <rect x="150" y="65" width="250" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#drop3)"/>
  <text x="275" y="91" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="13" fill="#166534">SET count = 1, sum = 0</text>

  <line x1="275" y1="107" x2="275" y2="145" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrLoop)"/>

  <!-- DECISION LOOP -->
  <polygon points="275,145 375,185 275,225 175,185" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#drop3)"/>
  <text x="275" y="189" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#9d174d">count &lt;= 5 ?</text>

  <!-- True Branch: Body -->
  <line x1="275" y1="225" x2="275" y2="265" stroke="#059669" stroke-width="2.5" marker-end="url(#arrLoop)"/>
  <text x="290" y="248" font-family="'Sarabun', sans-serif" font-weight="700" font-size="11" fill="#059669">True (วนรอบต่อ)</text>

  <rect x="140" y="265" width="270" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#drop3)"/>
  <text x="275" y="291" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="13" fill="#0369a1">sum = sum + count</text>

  <line x1="275" y1="307" x2="275" y2="340" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrLoop)"/>

  <rect x="140" y="340" width="270" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#drop3)"/>
  <text x="275" y="366" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="13" fill="#0369a1">count = count + 1</text>

  <!-- Loop back arrow -->
  <path d="M 140 361 L 80 361 L 80 185 L 175 185" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrLoop)"/>

  <!-- False Branch: Exit -->
  <line x1="375" y1="185" x2="460" y2="185" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="460" y1="185" x2="460" y2="420" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="460" y1="420" x2="385" y2="420" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrLoop)"/>
  <text x="390" y="175" font-family="'Sarabun', sans-serif" font-weight="700" font-size="11" fill="#dc2626">False (จบลูป)</text>

  <!-- OUTPUT -->
  <polygon points="175,440 365,440 385,400 195,400" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#drop3)"/>
  <text x="285" y="424" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="13" fill="#92400e">OUTPUT sum</text>

  <line x1="285" y1="440" x2="285" y2="475" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrLoop)"/>

  <!-- END -->
  <rect x="210" y="475" width="150" height="38" rx="19" fill="#e11d48" stroke="#f43f5e" stroke-width="2" filter="url(#drop3)"/>
  <text x="285" y="499" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#ffffff">END</text>
</svg>