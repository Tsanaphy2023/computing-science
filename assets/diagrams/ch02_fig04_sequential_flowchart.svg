<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <marker id="arrSeq" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="480" height="500" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#drop)"/>
  <text x="250" y="42" text-anchor="middle" font-family="'Kanit', sans-serif" font-weight="700" font-size="15" fill="#0369a1">ผังงานโครงสร้างแบบเรียงลำดับ (คำนวณพื้นที่สามเหลี่ยม)</text>

  <!-- START -->
  <rect x="175" y="70" width="150" height="38" rx="19" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#drop)"/>
  <text x="250" y="94" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#ffffff">START</text>

  <line x1="250" y1="108" x2="250" y2="148" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrSeq)"/>

  <!-- INPUT -->
  <polygon points="120,190 340,190 370,150 150,150" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#drop)"/>
  <text x="250" y="174" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="13" fill="#92400e">INPUT base, height</text>

  <line x1="250" y1="190" x2="250" y2="230" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrSeq)"/>

  <!-- PROCESS -->
  <rect x="100" y="230" width="300" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#drop)"/>
  <text x="250" y="258" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="13" fill="#166534">area = 0.5 * base * height</text>

  <line x1="250" y1="276" x2="250" y2="316" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrSeq)"/>

  <!-- OUTPUT -->
  <polygon points="135,360 325,360 355,320 165,320" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#drop)"/>
  <text x="250" y="344" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="13" fill="#92400e">OUTPUT area</text>

  <line x1="250" y1="360" x2="250" y2="400" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrSeq)"/>

  <!-- END -->
  <rect x="175" y="400" width="150" height="38" rx="19" fill="#e11d48" stroke="#f43f5e" stroke-width="2" filter="url(#drop)"/>
  <text x="250" y="424" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#ffffff">END</text>
</svg>