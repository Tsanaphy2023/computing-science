<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 560" width="100%" height="100%">
  <defs>
    <marker id="arrSel" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <filter id="drop2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="730" height="540" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#drop2)"/>
  <text x="375" y="40" text-anchor="middle" font-family="'Kanit', sans-serif" font-weight="700" font-size="16" fill="#0369a1">ผังงานโครงสร้างแบบทางเลือกหลายเงื่อนไข (จำแนกสถานะของสารตามอุณหภูมิ)</text>

  <!-- INPUT -->
  <polygon points="260,105 450,105 480,70 290,70" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#drop2)"/>
  <text x="375" y="92" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="13" fill="#92400e">INPUT temp (°C)</text>

  <line x1="375" y1="105" x2="375" y2="140" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrSel)"/>

  <!-- DECISION 1: temp >= 100 -->
  <polygon points="375,140 480,180 375,220 270,180" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#drop2)"/>
  <text x="375" y="184" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#9d174d">temp &gt;= 100 ?</text>

  <!-- True 1: Steam -->
  <line x1="480" y1="180" x2="590" y2="180" stroke="#059669" stroke-width="2"/>
  <line x1="590" y1="180" x2="590" y2="230" stroke="#059669" stroke-width="2" marker-end="url(#arrSel)"/>
  <text x="500" y="172" font-family="'Sarabun', sans-serif" font-weight="700" font-size="11" fill="#059669">True (จริง)</text>
  <polygon points="490,270 660,270 680,235 510,235" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#drop2)"/>
  <text x="590" y="256" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="12" fill="#0369a1">OUTPUT 'ก๊าซ (Steam)'</text>

  <!-- False 1 -> DECISION 2: temp <= 0 -->
  <line x1="375" y1="220" x2="375" y2="270" stroke="#dc2626" stroke-width="2" marker-end="url(#arrSel)"/>
  <text x="385" y="245" font-family="'Sarabun', sans-serif" font-weight="700" font-size="11" fill="#dc2626">False (เท็จ)</text>

  <polygon points="375,270 480,310 375,350 270,310" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#drop2)"/>
  <text x="375" y="314" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#9d174d">temp &lt;= 0 ?</text>

  <!-- True 2: Ice -->
  <line x1="270" y1="310" x2="160" y2="310" stroke="#059669" stroke-width="2"/>
  <line x1="160" y1="310" x2="160" y2="370" stroke="#059669" stroke-width="2" marker-end="url(#arrSel)"/>
  <text x="210" y="302" font-family="'Sarabun', sans-serif" font-weight="700" font-size="11" fill="#059669">True (จริง)</text>
  <polygon points="60,405 230,405 250,370 80,370" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#drop2)"/>
  <text x="160" y="391" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="12" fill="#92400e">OUTPUT 'ของแข็ง (Ice)'</text>

  <!-- False 2: Water -->
  <line x1="375" y1="350" x2="375" y2="370" stroke="#dc2626" stroke-width="2" marker-end="url(#arrSel)"/>
  <text x="385" y="362" font-family="'Sarabun', sans-serif" font-weight="700" font-size="11" fill="#dc2626">False</text>
  <polygon points="280,405 450,405 470,370 300,370" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#drop2)"/>
  <text x="375" y="391" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="600" font-size="12" fill="#166534">OUTPUT 'ของเหลว (Water)'</text>

  <!-- Flow down to END -->
  <line x1="590" y1="270" x2="590" y2="445" stroke="#0284c7" stroke-width="2"/>
  <line x1="160" y1="405" x2="160" y2="445" stroke="#0284c7" stroke-width="2"/>
  <line x1="375" y1="405" x2="375" y2="445" stroke="#0284c7" stroke-width="2"/>
  <line x1="160" y1="445" x2="590" y2="445" stroke="#0284c7" stroke-width="2"/>

  <line x1="375" y1="445" x2="375" y2="475" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrSel)"/>

  <!-- END -->
  <rect x="300" y="475" width="150" height="38" rx="19" fill="#e11d48" stroke="#f43f5e" stroke-width="2" filter="url(#drop2)"/>
  <text x="375" y="499" text-anchor="middle" font-family="'Sarabun', sans-serif" font-weight="700" font-size="13" fill="#ffffff">END</text>
</svg>